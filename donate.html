<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate to Schools | ShelfCycle</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="donate.js" defer></script>
    <script src="footer.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html"><img src="images/ShelfCycle_logo-removebg-preview.png" alt="shelf cycle logo" width="150"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="catalog.html">Catalog</a>
            <a href="swaps.html">Swaps</a>
            <a href="donate.html" class="active">Donate</a>
            <a href="maps.html">Maps</a>
            <a href="about.html">About</a>
            <a href="profile.html" class="profile-icon" aria-label="Your profile">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            </a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h1>Donate to schools</h1>
            <p>Give a book a second chapter in a classroom. Log your donation below — it joins the public list.</p>

            <div id="donateLoginHint" class="toolbar-card" hidden>
                <p class="shelf-empty">Log in on the <a href="index.html">home page</a> to record a donation.</p>
            </div>

            <form id="donateForm" class="book-form" hidden>
                <label>
                    Book title *
                    <input type="text" name="title" required maxlength="200">
                </label>
                <label>
                    Author *
                    <input type="text" name="author" required maxlength="200">
                </label>
                <label>
                    School *
                    <input type="text" name="school" required maxlength="200" placeholder="Which school received it?">
                </label>
                <button type="submit" class="primary-button">Record donation</button>
                <p id="donateMessage" role="status"></p>
            </form>
        </section>

        <section class="form-section" style="max-width: 900px;">
            <h2>Recent donations</h2>
            <div class="exchange-grid" id="donationList"></div>
        </section>
    </main>

    <footer>
        <p>Good books deserve another chapter.</p>
        <button type="button" id="featureButton" class="feature-button">Suggest a feature</button>
        <form id="featureForm" hidden>
            <textarea name="text" rows="2" maxlength="1000" placeholder="What should ShelfCycle do next?" required></textarea>
            <button type="submit">Send</button>
        </form>
        <p id="featureMessage" role="status"></p>
        <p>&copy; 2026 ShelfCycle. All rights reserved.</p>
    </footer>
</body>
</html>
